[project]
name = "multimodal-agentic-retrieval-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "easyocr>=1.7.2",
    "librosa>=0.11.0",
    "nemo-toolkit[asr]>=2.7.3",
    "soundfile>=0.14.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "torchvision>=0.21.0",
    "matplotlib>=3.11.0",
    "numpy>=2.5.0",
    "pillow>=12.2.0",
    "tqdm>=4.68.3",
    "transformers>=4.40.0,<5.0.0",
    "accelerate>=0.26.0",
    "jiwer>=3.0.4",
    "gdown>=5.2.0",
    "qwen-vl-utils>=0.0.8",
    "opencv-python>=4.13.0.92",
    "pandas>=2.2.0",
    "einops>=0.8.2",
    "timm>=1.0.28",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "ipykernel>=7.3.0",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }

