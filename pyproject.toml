[project]
name = "multimodal-agentic-retrieval-engine"
version = "0.1.0"
description = "Web-based multimedia retrieval system for AI Challenge HCMC"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic-settings>=2.6.0",
  "uvicorn[standard]>=0.32.0"
]

[project.scripts]
aic-ingest = "aic_retrieval.ingest:main"
aic-prepare = "aic_retrieval.prepare:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/aic_retrieval"]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
