# ==========================================
# CẤU HÌNH CODEX CLI (TỐI ƯU HÓA QUA 9ROUTER)
# ==========================================

# --- [ 1. CẤU HÌNH LÕI & ĐỊNH TUYẾN MODEL ] ---
personality = "pragmatic"
approvals_reviewer = "user"
model_reasoning_effort = "medium"
model = "Combo-heavy-main"
# --- [ 3. CẤU HÌNH AGENT ] ---
[agents]
max_threads = 6
max_depth = 1

[agents.subagent]
description = "Subagent role"
model = "Combo-heavy-main"
provider = "9router" # Đảm bảo subagent cũng bị ép đi qua 9router

# --- [ 4. CẤU HÌNH DỰ ÁN & MỨC ĐỘ TIN CẬY ] ---
[projects."/home/lqaq/PROJECT/Multimodal-Agentic-Retrieval-Engine"]
trust_level = "trusted"


# --- [ 5. GIAO DIỆN TERMINAL (TUI) & TÍNH NĂNG ] ---
[tui]
status_line = [
    "model-with-reasoning",
    "model",
    "git-branch",
    "five-hour-limit",
    "weekly-limit",
    "context-window-size",
    "used-tokens",
    "total-input-tokens",
    "total-output-tokens",
    "fast-mode",
    "thread-title",
    "context-remaining",
    "context-used"
]
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 4

[features]
memories = true
terminal_resize_reflow = true
goals = true
prevent_idle_sleep = true

