services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      AIC_DATA_ROOT: /data
      AIC_DATABASE_PATH: /data/app.sqlite
    volumes:
      - ./data:/data
    ports:
      - "${AIC_BACKEND_PORT:-8001}:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${AIC_FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
