services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      AIC_DATA_ROOT: /data
      AIC_DATABASE_PATH: /data/app.sqlite
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
