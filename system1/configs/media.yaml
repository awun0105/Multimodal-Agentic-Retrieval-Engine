schema_version: phase01_media_v2

keyframe:
  extension: .jpg
  naming: "{video_id}_f{frame_id:07d}"
  encoding:
    jpeg_quality: 95
    preserve_aspect_ratio: true
    long_side: 960

  roles:
    early:
      search_start_ratio: 0.10
      target_ratio: 0.20
      search_end_ratio: 0.30
    middle:
      search_start_ratio: 0.40
      target_ratio: 0.50
      search_end_ratio: 0.60
    late:
      search_start_ratio: 0.70
      target_ratio: 0.80
      search_end_ratio: 0.90

  selection:
    max_candidates_per_band: 5
    candidate_distribution: evenly_spaced_decoded_timeline
    invalid_candidate_policy:
      reject_decode_failure: true
      reject_abnormal_near_black: true
      reject_abnormal_near_white: true
    empty_band_policy: expand_toward_safe_shot_interior
    expansion_step_ratio: 0.10
    safe_interior_start_ratio: 0.05
    safe_interior_end_ratio: 0.95
    avoid_shot_boundary: true
    deduplicate_frame_id: true
    fail_video_when_no_valid_frame: true

  quality:
    metric: variance_of_laplacian
    compare_after_common_resize: true
    resize_width: 640
    resize_height: 360
    absolute_blur_threshold: null
    luma_standard: bt709
    near_black_luma_threshold: 16
    near_black_pixel_ratio_threshold: 0.98
    near_white_luma_threshold: 240
    near_white_pixel_ratio_threshold: 0.98

  representative:
    preferred_role: middle
    preferred_min_ratio_of_best: 0.85
    fallback: highest_quality
    tie_breaker: nearest_shot_temporal_center
    single_frame_is_representative: true

  semantic_sampling:
    enabled: true
    policy: temporal_visual_text_v1
    target_max_probe_gap_seconds: 3.0
    max_probe_candidates_per_shot: 24
    min_supplemental_separation_seconds: 1.0
    max_supplemental_keyframes_per_shot: 2
    visual_novelty:
      policy: dhash_v1
      hash_size: 8
      min_hamming_ratio: 0.25
    text_change:
      policy: mser_masked_edge_jaccard_v1
      max_long_side: 480
      canny_low: 50
      canny_high: 150
      signature_width: 64
      signature_height: 36
      min_plausible_regions: 2
      min_jaccard_distance: 0.35

thumbnail:
  extension: .webp
  width: 256
  naming: "{video_id}_f{frame_id:07d}"
  encoding:
    webp_quality: 80
    preserve_aspect_ratio: true
