schema_version: phase01_artifact_v2

resolved_config:
  filename: resolved_config.json
  hash_algorithm: sha256

checkpoint:
  root: "phase01_checkpoints/{release_id}/{video_id}"
  state_filename: state.json
  write_protocol:
    - write_local_temp
    - validate_outputs
    - compute_checksums
    - sync_persistent_outputs
    - atomically_update_state
    - mark_stage_complete
  stage_outputs:
    shots:
      - shots.parquet
      - transnet_predictions.json
    keyframes:
      - keyframes.zip
    asr:
      - asr_segments.parquet
      - asr_words.parquet
      - asr_status.json
      - asr_diagnostics.jsonl
    ocr:
      - ocr.parquet
      - ocr_status.json
    shot_captions:
      - shot_captions.parquet
    shot_transcript_links:
      - shot_transcript_links.parquet
    scenes:
      - scenes.parquet
      - scene_boundary_diagnostics.jsonl
      - scene_partition_quality.json
    scene_transcript_links:
      - scene_transcript_links.parquet
    scene_summaries:
      - scene_summaries.parquet
    package:
      - "{video_id}_structure.zip"
    sync:
      - sync_receipt.json

package:
  root: "{release_id}/phase01_structure/artifacts/{batch_id}"
  filename: "{video_id}_structure.zip"
  manifest_filename: manifest.json
  artifact_manifest_filename: artifact_manifest.json
  checksums_filename: checksums.json
  errors_filename: errors.jsonl
