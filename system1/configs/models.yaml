schema_version: phase01_models_v1_2

# One fixed local-only production model graph. Qwen is the semantic primary;
# Vintern-3B-R is the sticky fallback after Qwen has been unloaded.
# Model IDs and source revisions are pinned. Runtime workers never convert
# weights themselves. The active artifact uses official pinned source plus
# SHA-256 verified preconverted PyTorch weights because upstream Git LFS access
# to the canonical TensorFlow weights is currently quota-blocked.
phase01:
  shot_detection:
    provider: transnet_v2
    model_id: TransNetV2
    runtime: pytorch
    upstream_repo: soCzech/TransNetV2
    model_revision: 85cef72af9a916bdfd7cc94a670c9cdfbf12d1ed
    source_module: inference-pytorch/transnetv2_pytorch.py
    source_sha256: f7c1d437465579a8ec28a5add19853d2cb2755248ea4a4207678210a609428e1
    weights_file: transnetv2-pytorch-weights.pth
    artifact_subdir: transnetv2/85cef72af9a916bdfd7cc94a670c9cdfbf12d1ed
    weights_sha256: 834b10f25ae9e1b4e4f2652fe2843bd2b1388057a435d68b7c52635578fcc04d
    threshold: 0.5
    transition_run_boundary: midpoint
    conversion_verified: false
    subprocess_isolation: true

  asr:
    provider: nemo
    install_package: nemo_toolkit[asr]==2.7.3
    package_version: 2.7.3
    model_id: nvidia/parakeet-ctc-0.6b-vi
    model_revision: b0493142b49458810324e3db8be9e8e07b4ebc17
    model_file: parakeet-ctc-0.6b-vi.nemo
    language: vi
    segmentation: ffmpeg_silence
    max_segment_seconds: 12
    min_segment_seconds: 0.4
    silence_db: -35
    min_silence_duration: 0.6
    speech_pad_seconds: 0.2
    batch_size: 16

  asr_providers:
    faster_whisper:
      provider: faster_whisper
      package_version: 1.2.1
      model_id: Systran/faster-whisper-large-v3
      model_revision: edaa852ec7e145841d8ffdb056a99866b5f0a478
      language: auto
      vad_enabled: true
      beam_size: 5
      word_timestamps: false
      vad_parameters:
        threshold: 0.5
        min_speech_duration_ms: 0
        max_speech_duration_s: null
        min_silence_duration_ms: 2000
        speech_pad_ms: 400
      compute_type:
        cuda_default: float16
        cuda_oom_retry: int8_float16
        cpu: int8
    nemo:
      provider: nemo
      install_package: nemo_toolkit[asr]==2.7.3
      package_version: 2.7.3
      model_id: nvidia/parakeet-ctc-0.6b-vi
      model_revision: b0493142b49458810324e3db8be9e8e07b4ebc17
      model_file: parakeet-ctc-0.6b-vi.nemo
      language: vi
      segmentation: ffmpeg_silence
      max_segment_seconds: 12
      min_segment_seconds: 0.4
      silence_db: -35
      min_silence_duration: 0.6
      speech_pad_seconds: 0.2
      batch_size: 16

  ocr:
    provider: vintern_local
    sdk: transformers
    model_id: 5CD-AI/Vintern-1B-v3_5
    model_revision: b98f263eab246eb5269ade64edbdca8a887dc44d
    trust_remote_code: true
    torch_dtype: auto
    device_map: auto
    prompt_version: keyframe_ocr_v3
    response_schema_version: keyframe_ocr_response_v1
    structured_output_contract_version: vintern_plain_text_ocr_v1
    max_new_tokens: 512

  shot_caption:
    provider: qwen_local
    sdk: transformers
    model_id: Qwen/Qwen2.5-VL-7B-Instruct
    model_revision: cc594898137f460bfe9f0759e9844b3ce807cfb5
    trust_remote_code: false
    torch_dtype: float16
    device_map: cuda
    padding_side: left
    generation_contract_version: shot_caption_plain_text_fields_v1
    prompt_bundle_version: shot_caption_plain_text_fields_v1
    prompt_versions:
      caption_vi: shot_caption_vi_v1
      caption_en: shot_caption_en_v1
      objects_vi: shot_objects_vi_v1
      objects_en: shot_objects_en_v1
      actions_vi: shot_actions_vi_v1
      actions_en: shot_actions_en_v1
      visible_text_summary_vi: shot_visible_text_summary_vi_v1
      visible_text_summary_en: shot_visible_text_summary_en_v1
    response_schema_version: shot_caption_response_v3
    quantization:
      method: bitsandbytes
      package_version: 0.47.0
      mode: 4bit
      quant_type: nf4
      compute_dtype: float16
      double_quant: true
    max_new_tokens: 768
    fallbacks:
      - provider: vintern_reasoning_local
        sdk: transformers
        model_id: 5CD-AI/Vintern-3B-R-beta
        model_revision: 4fd34d713dfca446cdecc00d921f5038909e3efb
        trust_remote_code: true
        torch_dtype: float16
        low_cpu_mem_usage: true
        use_fast_tokenizer: false
        use_flash_attn: false
        image_size: 448
        max_dynamic_patches: 6
        use_thumbnail: true
        generation_contract_version: semantic_plain_text_v1
        max_new_tokens: 256
        do_sample: false
        num_beams: 1
        repetition_penalty: 1.0

  scene_boundary:
    provider: qwen_local
    model_key: shot_caption
    prompt_version: scene_boundary_primary_label_v2
    focused_prompt_version: scene_boundary_focused_label_v2
    consistency_prompt_version: scene_boundary_consistency_label_v2
    decision_contract_version: scene_boundary_label_v2

  scene_summary:
    provider: qwen_local
    model_key: shot_caption
    prompt_bundle_version: scene_summary_plain_text_v2
    prompt_versions:
      summary_vi: scene_summary_vi_v2
      summary_en: scene_summary_en_v2
    generation_contract_version: scene_summary_plain_text_v2
    response_schema_version: scene_summary_response_v1
