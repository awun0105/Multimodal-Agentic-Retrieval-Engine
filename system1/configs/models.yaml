schema_version: phase01_models_v1_2

# One fixed local-first production model graph. Gemini remains an optional
# request-level and runtime fallback for semantic stages.
# Model IDs and source revisions are pinned. Runtime workers never convert
# weights themselves. The active artifact uses official pinned source plus
# SHA-256 verified preconverted PyTorch weights because upstream Git LFS access
# to the canonical TensorFlow weights is currently quota-blocked.
phase01:
  shot_detection:
    provider: transnet_v2
    model_id: TransNetV2
    runtime: pytorch
    upstream_repo: soCzech/TransNetV2
    model_revision: 85cef72af9a916bdfd7cc94a670c9cdfbf12d1ed
    source_module: inference-pytorch/transnetv2_pytorch.py
    source_sha256: f7c1d437465579a8ec28a5add19853d2cb2755248ea4a4207678210a609428e1
    weights_file: transnetv2-pytorch-weights.pth
    artifact_subdir: transnetv2/85cef72af9a916bdfd7cc94a670c9cdfbf12d1ed
    weights_sha256: 834b10f25ae9e1b4e4f2652fe2843bd2b1388057a435d68b7c52635578fcc04d
    threshold: 0.5
    transition_run_boundary: midpoint
    conversion_verified: false
    subprocess_isolation: true

  asr:
    provider: nemo
    install_package: nemo_toolkit[asr]==2.6.0
    package_version: 2.6.0
    model_id: nvidia/parakeet-ctc-0.6b-vi
    model_revision: b0493142b49458810324e3db8be9e8e07b4ebc17
    model_file: parakeet-ctc-0.6b-vi.nemo
    language: vi
    segmentation: ffmpeg_silence
    max_segment_seconds: 12
    min_segment_seconds: 0.4
    silence_db: -35
    min_silence_duration: 0.6
    speech_pad_seconds: 0.2
    batch_size: 16

  asr_providers:
    faster_whisper:
      provider: faster_whisper
      package_version: 1.2.1
      model_id: Systran/faster-whisper-large-v3
      model_revision: edaa852ec7e145841d8ffdb056a99866b5f0a478
      language: auto
      vad_enabled: true
      beam_size: 5
      word_timestamps: false
      vad_parameters:
        threshold: 0.5
        min_speech_duration_ms: 0
        max_speech_duration_s: null
        min_silence_duration_ms: 2000
        speech_pad_ms: 400
      compute_type:
        cuda_default: float16
        cuda_oom_retry: int8_float16
        cpu: int8
    nemo:
      provider: nemo
      install_package: nemo_toolkit[asr]==2.6.0
      package_version: 2.6.0
      model_id: nvidia/parakeet-ctc-0.6b-vi
      model_revision: b0493142b49458810324e3db8be9e8e07b4ebc17
      model_file: parakeet-ctc-0.6b-vi.nemo
      language: vi
      segmentation: ffmpeg_silence
      max_segment_seconds: 12
      min_segment_seconds: 0.4
      silence_db: -35
      min_silence_duration: 0.6
      speech_pad_seconds: 0.2
      batch_size: 16

  ocr:
    provider: vintern_local
    sdk: transformers
    model_id: 5CD-AI/Vintern-1B-v3_5
    model_revision: b98f263eab246eb5269ade64edbdca8a887dc44d
    trust_remote_code: true
    torch_dtype: auto
    device_map: auto
    prompt_version: keyframe_ocr_v3
    response_schema_version: keyframe_ocr_response_v1
    structured_output_contract_version: vintern_plain_text_ocr_v1
    max_new_tokens: 512

  shot_caption:
    provider: qwen_local
    sdk: transformers
    model_id: Qwen/Qwen2.5-VL-7B-Instruct
    model_revision: cc594898137f460bfe9f0759e9844b3ce807cfb5
    trust_remote_code: false
    torch_dtype: float16
    device_map: cuda
    structured_output_contract_version: json_schema_prompt_v1
    quantization:
      method: bitsandbytes
      package_version: 0.47.0
      mode: 4bit
      quant_type: nf4
      compute_dtype: float16
      double_quant: true
    prompt_version: shot_caption_v2
    response_schema_version: shot_caption_response_v2
    max_new_tokens: 768
    fallbacks:
      - provider: gemini
        sdk: google-genai
        sdk_version: 2.13.0
        model_id: gemini-3.6-flash
        model_revision: gemini-3.6-flash
        thinking_level: medium
        prompt_version: shot_caption_v2
        response_schema_version: shot_caption_response_v2

  scene_boundary:
    provider: qwen_local
    model_key: shot_caption
    prompt_version: scene_boundary_primary_v1
    focused_prompt_version: scene_boundary_focused_v1
    consistency_prompt_version: scene_boundary_consistency_v1
    response_schema_version: scene_boundary_response_v1
    fallbacks:
      - provider: gemini
        sdk: google-genai
        sdk_version: 2.13.0
        model_id: gemini-3.6-flash
        model_revision: gemini-3.6-flash
        thinking_level: medium

  scene_summary:
    provider: qwen_local
    model_key: shot_caption
    prompt_version: scene_summary_v1
    response_schema_version: scene_summary_response_v1
    fallbacks:
      - provider: gemini
        sdk: google-genai
        sdk_version: 2.13.0
        model_id: gemini-3.6-flash
        model_revision: gemini-3.6-flash
        thinking_level: medium
