schema_version: phase01_pipeline_v1_7
pipeline_id: phase01_production_v1_7

execution:
  video_order: batch_manifest
  max_concurrent_videos: 1
  chunk_scheduler:
    max_chunk_videos: 4
    max_chunk_raw_bytes: 1610612736
    min_free_disk_gb: 20
    medium_free_disk_gb: 35
    medium_max_chunk_videos: 2
    low_disk_max_chunk_videos: 1
    ram:
      medium_available_gb: 8
      minimum_available_gb: 4
      medium_max_chunk_videos: 2
      low_max_chunk_videos: 1
  inference_batch_size:
    ocr: 4
    shot_captions: 2
  require_phase00_frame_timeline: true
  checkpoint_after_each_stage: true
  continue_after_retryable_video_failure: true
  gpu_heavy_models_resident: 1
  release_gpu_objects_before_empty_cache: true
  min_scratch_free_gb: 5
  min_model_cache_free_gb: 25

stages:
  order:
    - shots
    - keyframes
    - asr
    - ocr
    - shot_captions
    - shot_transcript_links
    - scenes
    - scene_transcript_links
    - scene_summaries
    - package
    - sync
  dependencies:
    shots: []
    keyframes: [shots]
    asr: []
    ocr: [keyframes]
    shot_captions: [keyframes, ocr]
    shot_transcript_links: [shots, asr]
    scenes: [shots, keyframes, ocr, shot_captions, shot_transcript_links]
    scene_transcript_links: [scenes, asr]
    scene_summaries: [scenes, scene_transcript_links, asr, keyframes, ocr, shot_captions]
    package:
      - shots
      - keyframes
      - asr
      - ocr
      - shot_captions
      - shot_transcript_links
      - scenes
      - scene_transcript_links
      - scene_summaries
    sync: [package]

shot_detection:
  model_key: shot_detection
  boundary_convention: "[start_frame, end_frame)"
  no_cut_status: transnet_v2_no_cut
  production_fallback: null

asr:
  model_key: asr
  no_audio_status: no_audio
  no_speech_status: no_speech
  exhausted_oom_status: failed_retryable
  continue_next_video_after_exhausted_oom: true
  decoder_failure_status: failed_retryable
  allow_greedy_fallback: false
  rejected_hypotheses_destination: diagnostics_only
  alignment:
    required_for_accepted_segments: true
    policy: ctc_word_alignment_v1
    interval_assignment:
      policy: max_overlap_midpoint_v1
      interval_convention: "[start_sec, end_sec)"
    text_reconstruction:
      normalization: unicode_word_v1

ocr:
  model_key: ocr
  run_on_keyframe_roles: [early, middle, late, supplemental]
  empty_status: empty
  failed_status: failed
  text_presence_filter:
    enabled: true
    policy: opencv_conservative_v1
    max_long_side: 960
    canny_low: 50
    canny_high: 150
    max_no_text_edge_density: 0.0015
    max_no_text_gray_std: 12

api:
  request_cache_backend: stage_local

retry:
  local_model_total_attempts: 2

scene_grouping:
  focused_review_keyframe_roles: [early, late, supplemental]
  focus_gap_count: 8
  context_shots_each_side: 4
  stride: 6
  boundary_threshold: 0.67
  non_boundary_threshold: 0.33
  dense_boundary_count: 2
  dense_boundary_gap_window: 3
  strong_disagreement_min_votes: 2
  strong_disagreement_requires_both_labels: true
  max_consistency_review_rounds: 1
  scene_confidence_aggregation: null_v1
  max_ocr_chars_per_shot: 800
  max_transcript_chars_per_shot: 1600
  quality_guard:
    enabled: true
    min_shot_count: 8
    suspicious_boundary_density: 0.90
    suspicious_one_shot_scene_rate: 0.80
    unresolved_action: fail_terminal
    degenerate_review:
      enabled: true
      focus_gap_count: 8
      context_shots_each_side: 6
      max_rounds: 1

scene_summary:
  max_representative_images: 12
  image_sampling: evenly_spaced_shots
  max_shot_evidence_items: 48
  max_ocr_chars_per_shot: 800
  max_transcript_chars: 12000
  max_total_evidence_chars: 30000

manual_review:
  sample_size: 12
  sampling: deterministic_stratified
  kinds: [shot_caption, scene_boundary, scene_summary]

schemas:
  resolved_config: resolved_config_v1
  checkpoint_state: phase01_checkpoint_state_v2
  shots: shots_v1
  keyframes: keyframes_v3
  asr_segments: asr_segments_v1
  asr_words: asr_words_v1
  ocr: ocr_v2
  shot_captions: shot_captions_v4
  shot_transcript_links: shot_transcript_links_v2
  scenes: scenes_v2
  scene_transcript_links: scene_transcript_links_v2
  scene_summaries: scene_summaries_v3

production_readiness:
  required_non_null_paths:
    - models.shot_detection.model_revision
    - models.shot_detection.source_sha256
    - models.shot_detection.weights_sha256
    - models.asr.model_revision
    - models.asr.model_sha256
    - models.asr.decoder.language_model_sha256
    - models.asr.decoder.lexicon_sha256
    - models.asr.decoder.runtime_artifact.manifest_sha256
    - models.ocr.model_id
    - models.ocr.model_revision
    - models.shot_caption.model_id
    - models.shot_caption.model_revision
    - media.keyframe.encoding.jpeg_quality
    - media.keyframe.quality.resize_width
    - media.keyframe.quality.resize_height
    - media.keyframe.quality.near_black_luma_threshold
    - media.keyframe.quality.near_black_pixel_ratio_threshold
    - media.keyframe.quality.near_white_luma_threshold
    - media.keyframe.quality.near_white_pixel_ratio_threshold
    - media.thumbnail.encoding.webp_quality
    - phase01.retry.local_model_total_attempts
    - phase01.scene_grouping.dense_boundary_count
    - phase01.scene_grouping.dense_boundary_gap_window
    - phase01.scene_grouping.strong_disagreement_min_votes
    - phase01.scene_grouping.max_consistency_review_rounds
    - phase01.scene_grouping.scene_confidence_aggregation
    - storage.checkpoint.repo_id

smoke:
  schema_version: phase01_real_smoke_config_v1
  video_id: L30_V040
  required_stage_sources:
    shots: computed
    keyframes: computed
    asr: computed
    ocr: computed
    shot_captions: computed
    shot_transcript_links: computed
    scenes: computed
    scene_transcript_links: computed
    scene_summaries: computed
    package: computed
    sync: computed
  source_release:
    repo_id: 1thesudden/AIOU26_release_test
    repo_type: dataset
    revision: 44b884df9ad1b88101ff9a5c751c6845e2fb9511
    prefix: ""
    release_id: canonical_release_v001
  source_raw:
    repo_id: 1thesudden/AIOU26_raw
    repo_type: dataset
    revision: 6003777f3d6a1b264284659ac744a5aa4297a1db
    video_path: canonical_raw_v001/raw_videos/L30_V040.mp4
    video_sha256: af453029f25f5169363bef87888b63389a589838f6d0d879af936801fa6ac632
    metadata_path: canonical_raw_v001/metadata/L30_V040.json
    metadata_sha256: be91e676ac612498fff658ed9bbea1af6264002dac98983f85b48b6633a14480
  timeline:
    relative_path: frame_timeline/L30_V040.parquet
    sha256: 8bf9120ad22b2d2b0a7bfc249af62525978b418a786aa115b38d3afb59a943ce
    vlm_frame_id: 250
