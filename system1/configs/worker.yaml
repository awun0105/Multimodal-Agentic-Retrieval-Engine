# Per-video worker for the simplified pipeline.
# Design: docs/architecture/system1-target.md. Models: ADR 0023.
# Trial evidence: docs/plans/active/system1-pipeline-simplification.md.
schema_version: worker_v1

keyframes:
  candidate_interval_sec: 2.0
  min_change: 0.15
  shot_drift: 0.35
  max_shot_sec: 12.0
  edge_margin_frames: 2
  jpeg_long_side: 1280
  jpeg_quality: 90
  thumbnail_width: 320

storage:
  repo_type: dataset
  raw_repo: 1thesudden/AIOU26_raw
  source_repo: 1thesudden/AIOU26_release  # Phase00 batch manifests and raw mapping (read only)
  output_repo: 1thesudden/AIOU26_release_test  # production runs pass --output-repo explicitly

model_artifacts:
  backend: hf_dataset
  repo_id: 1thesudden/AIOU26_checkpoints
  repo_type: dataset
  revision: main
  prefix: model_artifacts

models:
  shot_detection:
    model_revision: 85cef72af9a916bdfd7cc94a670c9cdfbf12d1ed
    source_sha256: f7c1d437465579a8ec28a5add19853d2cb2755248ea4a4207678210a609428e1
    weights_sha256: 834b10f25ae9e1b4e4f2652fe2843bd2b1388057a435d68b7c52635578fcc04d
    artifact_subdir: transnetv2/85cef72af9a916bdfd7cc94a670c9cdfbf12d1ed
    conversion_verified: false
    threshold: 0.5
    transition_run_boundary: midpoint
  image_embedding:
    model_id: google/siglip2-so400m-patch14-384
    revision: e8e487298228002f3d8a82e0cd5c8ea9c567f57f
    batch_size: 32
    text_max_length: 64
  text_embedding:
    model_id: intfloat/multilingual-e5-large
    revision: 3d7cfbdacd47fdda877c5cd8a79fbcc4f2a574f3
    batch_size: 32
  asr:
    model_id: khanhld/chunkformer-ctc-large-vie
    revision: 311fc03558a895dc2b32957f2fb4236c7fb1455b
    chunk_size: 64
    left_context_size: 128
    right_context_size: 128
    total_batch_duration_sec: 600  # 14400 and 1800 ran out of T4 memory on a 38-minute video
  ocr:
    detector: easyocr
    detector_languages: [vi]
    recognizer: vietocr_vgg_transformer
    crop_padding_px: 4
    min_crop_px: 8
    batch_size: 32
    max_image_side: 960
    rerun_min_change: 0.15  # later keyframes in a shot rerun OCR only past this dHash change (frame or lower third)

# Caption pass (`caption-batch`, ADR 0025); not loaded by the worker.
captions:
  model_id: Qwen/Qwen3-VL-4B-Instruct
  revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
  batch_size: 16
  max_new_tokens: 700
  max_image_side: 512

text:
  asr_chunk_min_sec: 10.0
  asr_chunk_max_sec: 30.0
  asr_chunk_max_gap_sec: 2.0
  ocr_min_line_chars: 3
  ocr_min_syllable_ratio: 0.6
  ocr_repeat_min_fraction: 0.5

scenes:  # ADR 0026 initial parameters, to be tuned on hand-labelled videos
  w_img: 0.4
  w_cap: 0.3
  w_asr: 0.2
  w_sil: 0.2
  w_ocr: 0.1
  scene_threshold: 0.55
  silence_sec: 2.0
  min_scene_sec: 2.0
  max_scene_sec: 90
