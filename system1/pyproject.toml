[project]
name = "system1"
version = "0.1.0"
description = "System 1 data factory for HCMC AI Challenge multimedia retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.scripts]
system1 = "system1.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ipykernel>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
