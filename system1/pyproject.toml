[project]
name = "system1"
version = "0.1.0"
description = "System 1 data factory for HCMC AI Challenge multimedia retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0.0",
    "faiss-cpu>=1.8,<2",
    "numpy==2.1.3",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.0",
    "huggingface_hub>=0.24.0",
    "jsonschema>=4.23.0",
    "opencv-python-headless>=4.10.0",
    "packaging>=24.0",
    "pillow>=10.4.0",
    "psutil>=5.9.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
# Per-video worker (ADR 0023). VietOCR pins old Pillow, einops, and gdown, so
# it is installed separately with `pip install --no-deps vietocr==0.3.13`.
worker = [
    "accelerate>=1.0",
    "chunkformer==1.2.2; python_version >= '3.11'",
    "easyocr==1.7.2",
    "einops>=0.8",
    "gdown>=5.0",
    "prefetch-generator>=1.0.1",
    "sentence-transformers>=3.0",
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=4.57",
    "xgrammar>=0.2",
]

# Release build and bucket publish (ADR 0025). The Storage Bucket API needs
# huggingface_hub 1.x.
release = [
    "huggingface_hub>=1.27,<2",
]

[project.scripts]
system1 = "system1.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ipykernel>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
